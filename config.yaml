# Enterprise-Grade Vehicle Damage Intelligence & Automotive Repair Configuration
model_path: "models/best.pt"
alternative_model_path: "models/best.pt"
conf_threshold: 0.35
match_tolerance: 0.08
embedding_mode: "classical"  # "learned" uses YOLO penultimate-layer features; requires fresh baselines

data_dir: "data"
slots:
  - "front"
  - "rear"
  - "left"
  - "right"

# Fast Video Walkaround (2-3 second keyframe scan)
video_walkaround:
  sample_fps: 1.5
  max_keyframes: 24
  min_blur_threshold: 65.0
  iou_cluster_thresh: 0.35

# Image Quality Assessment & Glare Rejection
quality_checks:
  min_blur_score: 80.0
  min_brightness: 40.0
  max_brightness: 225.0
  min_contrast: 25.0
  glare_v_thresh: 245       # Specular highlight brightness threshold (HSV V)
  glare_s_thresh: 35        # Specular highlight desaturation threshold (HSV S)

# Location / City Tier Labor & Booth Rates (INR ₹)
location_tiers:
  "Tier 1 (Metros: Delhi, Mumbai, Bengaluru, Chennai, Hyd)":
    denting_labor_hr: 480.0
    paint_booth_panel: 2800.0
    multiplier: 1.15
  "Tier 2 (Cities: Pune, Ahmedabad, Coimbatore, Jaipur, Kochi)":
    denting_labor_hr: 360.0
    paint_booth_panel: 2200.0
    multiplier: 1.00
  "Tier 3 (Regional / Towns)":
    denting_labor_hr: 260.0
    paint_booth_panel: 1700.0
    multiplier: 0.85

# Workshop Categories
workshop_types:
  "Authorized OEM Dealer (ASS - 100% Genuine Parts)":
    labor_markup: 1.20
    parts_markup: 1.00
    gst_rate: 0.18
  "Multi-Brand Independent Bodyshop (GoMechanic / FNG)":
    labor_markup: 0.80
    parts_markup: 0.85
    gst_rate: 0.18

